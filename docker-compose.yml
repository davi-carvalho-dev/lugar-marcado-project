services:
  mysql:
    image: mysql:8.4
    container_name: lugar-marcado-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lugar_marcado
      MYSQL_USER: lugar
      MYSQL_PASSWORD: lugar123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: